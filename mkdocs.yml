site_name: Käyttöohje
site_url: https://gispocoding.github.io/Qfield-putket/
copyright: 'Tekijä: <a href="mailto:info@gispo.fi">Gispo Suomi Oy</a>'

nav:
  - '<img src="img/markkeri.png"/> Koti': index.md
  - 1. Johdanto: 1_johdanto.md
  - 2. Projektin valmistelu: 2_projektin_valmistelu_qgississa_ja_vienti_qfieldiin.md
  - 3. Lomakemääritykset: 3_lomakemaaritykset.md
  - 4. Kenttätyöskentely: 4_kenttatyoskentely.md
  - 5. Muutosloki: muutosloki.md

use_directory_urls: false

markdown_extensions:
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      toc_depth: 2

theme:
  name: material
  language: fi
  custom_dir: docs/overrides
  features:
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.integrate
    - search.suggest
    - search.highlight
    - header.autohide
    - content.code.copy
  palette:
    scheme: default
  logo: img/gispologo.svg
  favicon: img/gispologo.svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
  - glightbox

extra_css:
  - stylesheets/extra.css