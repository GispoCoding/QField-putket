site_name: Käyttöohje
site_url: https://gispocoding.github.io/QField-putket/
copyright: 'Tekijä: <a href="mailto:info@gispo.fi">Gispo Suomi Oy</a>'

nav:
  - '<img src="img/markkeri.png"/> Koti': index.md
  - 0. Ylläpitäjän ohje:
      - Yleiskuva: 0_yllapitajan_ohje.md
      - QGIS-projektin valmistelu: projektin_valmistelu_qgississa_ja_vienti_qfieldiin.md
      - Lomakemääritykset: lomakemaaritykset.md
  - 1. QFieldin käyttöönotto: 1_qfieldin_kayttoonotto.md
  - 2. Kenttätyöskentely: 2_kenttatyoskentely.md
  - 3. Muutosloki: 3_muutosloki.md

use_directory_urls: false

markdown_extensions:
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      toc_depth: 3

theme:
  name: material
  language: fi
  custom_dir: docs/overrides
  features:
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.integrate
    - search.suggest
    - search.highlight
    - header.autohide
    - content.code.copy
  palette:
    scheme: default
  logo: img/gispologo.svg
  favicon: img/gispologo.svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
  - glightbox
  - exclude:
      glob:
        - 'Käyttöönottodokumentti.md'

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/collapsible-toc.js
